project:
  name: "Clayz Presentation Skills"
  original_architecture: "clayz"
  brand: "clayz"

public_growth_boundary:
  bundled_real_cases: false
  bundled_taste_corpus: false
  bundled_personal_preferences: false
  automatic_aesthetic_truth: false
  user_growth_route: "human-governed knowledge scaffold"

deliberately_excluded:
  - "reveal.js"
  - "Marp"
  - "PosterLlama"
  - "Typst/Paged"
  - "external master systems"
  - "runtime or model weights"

