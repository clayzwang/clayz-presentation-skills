name: release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLAYZ_RELEASE_DENYLIST_B64: ${{ secrets.CLAYZ_RELEASE_DENYLIST_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare private release denylist
        if: ${{ env.CLAYZ_RELEASE_DENYLIST_B64 != '' }}
        run: |
          python -c "import base64,os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'release-denylist').write_bytes(base64.b64decode(os.environ['CLAYZ_RELEASE_DENYLIST_B64']))"
          echo "CLAYZ_RELEASE_DENYLIST=$RUNNER_TEMP/release-denylist" >> "$GITHUB_ENV"
      - name: Validate the release tree
        run: python scripts/validate_all.py
      - name: Resolve version and bilingual release notes
        id: release
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path.cwd()
          version = (root / "VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads((root / ".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          if manifest["version"] != version:
              raise SystemExit("plugin manifest version does not match VERSION")
          notes = root / "release" / f"v{version}-release-notes.md"
          if not notes.is_file():
              raise SystemExit(f"missing bilingual release notes: {notes}")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
              output.write(f"notes={notes.as_posix()}\n")
          PY
      - name: Guard immutable release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tagged_commit="$(git rev-list -n1 "$TAG")"
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "Refusing to move existing tag $TAG from $tagged_commit to $GITHUB_SHA."
              exit 1
            fi
          fi
      - name: Fetch reviewed Windows offline wheels
        run: python scripts/fetch_offline_wheels.py --platform windows
      - name: Build Cloud Light, Local Light, and the Windows offline add-on
        run: python scripts/build_runtime_packs.py --platform windows
      - name: Verify release archives, nested wheels, and checksums
        run: python scripts/verify_release_bundles.py --platform windows
      - name: Publish or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name 'SHA256SUMS.txt' \) -print | sort)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected three ZIP archives plus SHA256SUMS.txt; found ${#assets[@]} files."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            for file in "${assets[@]}"; do
              name="$(basename "$file")"
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                echo "Release asset $name already exists; leaving it unchanged."
              else
                gh release upload "$TAG" "$file"
              fi
            done
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Clayz Presentation Skills $TAG" \
              --notes-file "$NOTES" \
              "${assets[@]}"
          fi
