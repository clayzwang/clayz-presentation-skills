name: "Feature request / 功能建议"
description: "Propose a portable improvement and explain the problem it solves / 提议可迁移的改进并说明所解决的问题"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem before prescribing a solution.
        请先说明真实问题，再提出方案；真实案例、组织偏好和私有资产不会进入公共版本。

  - type: textarea
    id: problem
    attributes:
      label: "Problem to solve / 希望解决的问题"
      description: "Who encounters it, in which workflow, and why it matters / 谁在什么流程中遇到，为什么重要"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: "Primary stage / 主要阶段"
      options:
        - "Logic / 逻辑"
        - "Copy / 文案"
        - "Art Direction / 艺术指导"
        - "Output / 输出"
        - "Supervisor / 监督"
        - "Cross-stage / 跨阶段"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed capability / 建议能力"
      description: "Describe desired behavior, not private implementation material / 描述期望行为，不要上传私有实现材料"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered / 已考虑的替代方案"

  - type: checkboxes
    id: portability
    attributes:
      label: "Portability and public boundary / 可迁移性与公开边界"
      options:
        - label: "This request can be implemented without private decks, company material, bundled fonts, or proprietary datasets. / 此建议无需私有PPT、公司材料、捆绑字体或专有数据集即可实现。"
          required: true
